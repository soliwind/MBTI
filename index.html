<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 포켓몬 매칭</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 메인 헤더 -->
        <header>
            <h1>POKÉMON x MBTI</h1>
            <p>나의 영혼을 닮은 포켓몬 카드는?</p>
        </header>

        <!-- MBTI 입력 섹션 -->
        <div id="intro-section" class="glass-panel">
            <div class="mbti-selection-board">
                <!-- E / I -->
                <div class="mbti-row">
                    <button class="mbti-btn active" data-group="ei" data-val="E"><strong>E</strong> 외향형</button>
                    <button class="mbti-btn" data-group="ei" data-val="I"><strong>I</strong> 내향형</button>
                </div>
                <!-- S / N -->
                <div class="mbti-row">
                    <button class="mbti-btn active" data-group="sn" data-val="S"><strong>S</strong> 감각형</button>
                    <button class="mbti-btn" data-group="sn" data-val="N"><strong>N</strong> 직관형</button>
                </div>
                <!-- T / F -->
                <div class="mbti-row">
                    <button class="mbti-btn active" data-group="tf" data-val="T"><strong>T</strong> 사고형</button>
                    <button class="mbti-btn" data-group="tf" data-val="F"><strong>F</strong> 감정형</button>
                </div>
                <!-- J / P -->
                <div class="mbti-row">
                    <button class="mbti-btn active" data-group="jp" data-val="J"><strong>J</strong> 판단형</button>
                    <button class="mbti-btn" data-group="jp" data-val="P"><strong>P</strong> 인식형</button>
                </div>
            </div>
            
            <button id="match-btn" class="primary-btn">내 카드 뽑기</button>
        </div>

        <!-- 결과 카드 섹션 -->
        <div id="result-section" class="glass-panel hidden">
            <div class="result-header">
                <span class="mbti-badge" id="result-mbti">MBTI</span>
                <h2 id="result-name">포켓몬 이름</h2>
            </div>
            
            <!-- 실제 TCG 카드 3D 렌더링 영역 -->
            <div class="card-container">
                <div class="tcg-card" id="pokemon-card">
                    <img id="result-img" src="" alt="포켓몬 카드">
                    <div class="card-glare"></div>
                </div>
            </div>

            <div class="result-info">
                <p id="result-desc">포켓몬 설명이 들어갑니다.</p>
            </div>

            <button id="reset-btn" class="secondary-btn">다시 뽑기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
