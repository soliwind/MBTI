<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 포켓몬 매칭</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MBTI 입력 섹션 -->
    <div id="intro-section" class="container">
        <h1>포켓몬 성격 테스트</h1>
        <p>나와 가장 잘 맞는 포켓몬은 누구일까?</p>
        
        <div class="mbti-selectors">
            <select id="mbti-e-i">
                <option value="E">E (외향형)</option>
                <option value="I">I (내향형)</option>
            </select>
            <select id="mbti-s-n">
                <option value="S">S (감각형)</option>
                <option value="N">N (직관형)</option>
            </select>
            <select id="mbti-t-f">
                <option value="T">T (사고형)</option>
                <option value="F">F (감정형)</option>
            </select>
            <select id="mbti-j-p">
                <option value="J">J (판단형)</option>
                <option value="P">P (인식형)</option>
            </select>
        </div>
        <button id="match-btn">내 포켓몬 확인하기</button>
    </div>

    <!-- 결과 카드 섹션 -->
    <div id="result-section" class="container hidden">
        <h2>당신의 영혼의 파트너는...</h2>
        
        <div class="card-container">
            <div class="card" id="pokemon-card">
                <div class="card-glare"></div>
                <div class="card-content">
                    <h3 id="result-mbti">MBTI</h3>
                    <h2 id="result-name">포켓몬 이름</h2>
                    <img id="result-img" src="" alt="포켓몬 이미지">
                    <div class="stats">
                        <p id="result-desc">포켓몬 설명이 들어갑니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <button id="reset-btn" class="outline-btn">다른 MBTI 테스트하기</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
